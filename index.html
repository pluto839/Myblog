<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pluto's Notes</title>
<meta name="description" content="一个极客的技术笔记与知识分享站">
<link rel="icon" href="img/avatar.svg">
<script>
  var s = localStorage.getItem('pluto-theme');
  var pd = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var t = s || (pd ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
</script>
<link rel="stylesheet" href="css/pluto-custom.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }
  .top-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.6);
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  [data-theme="dark"] .top-nav {
    background: rgba(10,10,30,0.6);
    border-bottom-color: rgba(255,255,255,0.05);
  }
  .top-nav .logo {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-decoration: none;
    background: linear-gradient(90deg, #3273dc, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  [data-theme="dark"] .top-nav .logo {
    background: linear-gradient(90deg, #79c0ff, #d2a8ff);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .top-nav nav a {
    color: var(--pluto-text);
    text-decoration: none;
    margin-left: 24px;
    font-size: 0.95rem;
    font-weight: 500;
    transition: color 0.2s;
  }
  .top-nav nav a:hover { color: var(--pluto-accent); }

  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 24px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #3273dc, #a855f7, #79c0ff, #3273dc);
    animation: spin 8s linear infinite;
    filter: blur(4px);
    opacity: 0.7;
  }
  [data-theme="dark"] .avatar-wrap::before {
    background: conic-gradient(from 0deg, #79c0ff, #d2a8ff, #9be7fd, #79c0ff);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar-wrap img {
    position: relative;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    z-index: 1;
    animation: pluto-float 4s ease-in-out infinite;
  }
  [data-theme="dark"] .avatar-wrap img {
    border-color: #2a2a4a;
  }

  h1 {
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 4px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #3273dc 0%, #a855f7 50%, #e879f9 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  [data-theme="dark"] h1 {
    background: linear-gradient(135deg, #79c0ff 0%, #d2a8ff 50%, #f0f6fc 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .tagline {
    font-size: 1.15rem;
    color: #666;
    font-style: italic;
    margin-bottom: 40px;
    letter-spacing: 1px;
  }
  [data-theme="dark"] .tagline { color: #a8b3c7; }

  .badges {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 48px;
  }
  .badge {
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    background: rgba(50, 115, 220, 0.1);
    color: #3273dc;
    border: 1px solid rgba(50, 115, 220, 0.2);
  }
  [data-theme="dark"] .badge {
    background: rgba(121, 192, 255, 0.1);
    color: #79c0ff;
    border-color: rgba(121, 192, 255, 0.2);
  }

  .actions {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(50,115,220,0.3); }
  .btn-primary {
    background: linear-gradient(135deg, #3273dc, #a855f7);
    color: #fff;
  }
  .btn-secondary {
    background: rgba(50, 115, 220, 0.1);
    color: #3273dc;
    border: 1px solid rgba(50, 115, 220, 0.3);
  }
  [data-theme="dark"] .btn-secondary {
    background: rgba(121, 192, 255, 0.1);
    color: #79c0ff;
    border-color: rgba(121, 192, 255, 0.3);
  }
  .typed { border-right: 2px solid var(--pluto-accent); padding-right: 4px; }
</style>
</head>
<body>

<div class="pluto-scene">
  <div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div>
  <div class="shooting-star" style="top:8%;left:60%;animation-delay:-1s"></div>
  <div class="shooting-star" style="top:20%;left:30%;animation-delay:-3s"></div>
</div>

<nav class="top-nav">
  <a href="/" class="logo">Pluto's Notes</a>
  <nav>
    <a href="archives/">归档</a>
    <a href="categories/">分类</a>
    <a href="tags/">标签</a>
    <a href="links/">友链</a>
    <a href="about/">关于</a>
  </nav>
</nav>

<div class="avatar-wrap">
  <img src="img/avatar.svg" alt="Pluto">
</div>

<h1>PLUTO</h1>
<div class="tagline" id="tagline"></div>

<div class="badges">
  <span class="badge">🔓 Reverse Engineering</span>
  <span class="badge">🌐 Web Security</span>
  <span class="badge">🏴 CTF</span>
  <span class="badge">🤖 Python</span>
</div>

<div class="actions">
  <a href="archives/" class="btn btn-primary">📚 开始阅读</a>
  <a href="about/" class="btn btn-secondary">👤 了解更多</a>
  <a href="https://github.com/pluto839" class="btn btn-secondary" target="_blank">⭐ GitHub</a>
</div>

<button class="theme-toggle" id="plutoThemeToggle" title="切换日/夜模式">🌙</button>

<script>
(function(){
  var saved = localStorage.getItem('pluto-theme');
  var btn = document.getElementById('plutoThemeToggle');
  var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = saved || (prefersDark ? 'dark' : 'light');
  apply(theme);
  btn.addEventListener('click', function(){
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('pluto-theme', theme);
    apply(theme);
  });
  function apply(t){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
  }
})();

var lines = ['> Hack the planet. Explore the unknown.',
             '> In code we trust, in vuln we thrive.',
             '> 用代码丈量世界，记录每一处精彩。'];
var li = 0, ci = 0, deleting = false;
var el = document.getElementById('tagline');
function type() {
  var line = lines[li];
  if (!deleting) {
    el.classList.add('typed');
    el.textContent = line.slice(0, ++ci);
    if (ci === line.length) { deleting = true; setTimeout(type, 2200); return; }
  } else {
    el.textContent = line.slice(0, --ci);
    if (ci === 0) { deleting = false; li = (li + 1) % lines.length; }
  }
  setTimeout(type, deleting ? 30 : 70);
}
type();

var stars = 60;
var scene = document.querySelector('.pluto-scene');
for (var i = 0; i < stars; i++) {
  var s = document.createElement('span');
  s.className = 'star';
  s.style.top = Math.random()*100 + '%';
  s.style.left = Math.random()*100 + '%';
  s.style.animationDelay = Math.random()*5 + 's';
  s.style.animationDuration = (2 + Math.random()*3) + 's';
  var sz = (1 + Math.random()*1.5) + 'px';
  s.style.width = sz; s.style.height = sz;
  scene.appendChild(s);
}
</script>
<script src="js/pluto-cursor.js"></script>
</body>
</html>
