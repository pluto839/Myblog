<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1a0033"/>
<stop offset="50%" stop-color="#003366"/>
<stop offset="100%" stop-color="#006699"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="400" fill="url(#bg)"/>
<g filter="url(#glow)" opacity="0.9">
<circle cx="100" cy="300" r="2" fill="#0ff"/>
<circle cx="200" cy="100" r="3" fill="#0ff"/>
<circle cx="400" cy="200" r="2" fill="#ff0"/>
<circle cx="600" cy="80" r="3" fill="#0ff"/>
<circle cx="700" cy="280" r="2" fill="#ff0"/>
<circle cx="350" cy="350" r="2" fill="#0ff"/>
</g>
<g fill="none" stroke="#0ff" stroke-width="1.5" opacity="0.5">
<line x1="100" y1="300" x2="200" y2="100"/>
<line x1="200" y1="100" x2="400" y2="200"/>
<line x1="400" y1="200" x2="600" y2="80"/>
<line x1="400" y1="200" x2="700" y2="280"/>
<line x1="400" y1="200" x2="350" y2="350"/>
</g>
<text x="400" y="220" text-anchor="middle" font-family="monospace" font-size="56" font-weight="bold" fill="#fff" filter="url(#glow)">BLOG</text>
<text x="400" y="260" text-anchor="middle" font-family="monospace" font-size="20" fill="#0ff">//hexo.init()</text>
<rect x="60" y="60" width="40" height="40" rx="4" fill="none" stroke="#0ff" stroke-width="1.5" opacity="0.5"/>
<rect x="700" y="60" width="40" height="40" rx="4" fill="none" stroke="#ff0" stroke-width="1.5" opacity="0.5"/>
<rect x="60" y="300" width="40" height="40" rx="4" fill="none" stroke="#ff0" stroke-width="1.5" opacity="0.5"/>
<rect x="700" y="300" width="40" height="40" rx="4" fill="none" stroke="#0ff" stroke-width="1.5" opacity="0.5"/>
</svg>
